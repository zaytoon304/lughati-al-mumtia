<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لغتي الممتعة — كتاب تفاعلي للصف الأول الابتدائي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#7c4dff; --c2:#ff6d00; --c3:#00c853; --c4:#ff4081; --c5:#00b0ff;
  --bg1:#fff8e1; --card:#ffffff; --ink:#37306b; --soft:#f3efff;
  --shadow:0 6px 0 rgba(0,0,0,.08), 0 10px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;
  background:linear-gradient(160deg,#fff8e1 0%,#e8f5ff 55%,#f3e5ff 100%);
  min-height:100vh; color:var(--ink);
}
header{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 16px; background:rgba(255,255,255,.92); backdrop-filter:blur(6px);
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}
header .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
header .brand .logo{font-size:1.6rem}
.star-chip{
  background:#fff3c4; border:2px solid #ffd54f; border-radius:999px;
  padding:4px 14px; font-weight:800; font-size:1.05rem; white-space:nowrap;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; cursor:pointer; font-family:inherit; font-weight:800;
  border-radius:18px; padding:12px 22px; font-size:1.1rem; color:#fff;
  background:var(--c1); box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.btn:active{transform:scale(.95)}
.btn.orange{background:var(--c2)} .btn.green{background:var(--c3)}
.btn.pink{background:var(--c4)} .btn.blue{background:var(--c5)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #e0d7ff}
.btn.small{padding:8px 16px;font-size:.95rem;border-radius:14px}
main{max-width:900px;margin:0 auto;padding:18px 14px 80px}
.screen-title{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.screen-title h2{margin:0;font-size:1.45rem}
.hero{
  text-align:center; padding:26px 16px 10px;
}
.hero .big-emoji{font-size:3.4rem}
.hero h1{margin:8px 0 4px;font-size:1.9rem}
.hero p{margin:0 0 8px;font-size:1.1rem;color:#5c548c}
.progress-wrap{max-width:420px;margin:14px auto 4px}
.progress-bar{height:16px;background:#e9e4ff;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffd54f,#ff9800);border-radius:999px;transition:width .5s ease}
.progress-label{font-size:.95rem;color:#5c548c;margin-top:6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.unit-card{
  background:var(--card); border-radius:22px; padding:18px 14px; text-align:center;
  box-shadow:var(--shadow); cursor:pointer; border:3px solid transparent;
  transition:transform .15s ease;
}
.unit-card:hover{transform:translateY(-4px)}
.unit-card .u-icon{font-size:2.6rem}
.unit-card h3{margin:8px 0 4px;font-size:1.15rem}
.unit-card p{margin:0;font-size:.9rem;color:#7a72a8;min-height:2.4em}
.unit-card .u-stars{margin-top:8px;font-size:1.05rem;letter-spacing:2px}
.letters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.letter-tile{
  background:var(--card); border-radius:20px; font-family:inherit; border:none; cursor:pointer;
  font-size:2.2rem; font-weight:800; padding:16px 0; color:var(--ink);
  box-shadow:var(--shadow); transition:transform .12s ease;
}
.letter-tile:active{transform:scale(.93)}
.letter-tile.visited{background:#e8fff0;border:2px solid #a5e8bf}
.letter-detail{
  background:var(--card); border-radius:26px; padding:22px; text-align:center; box-shadow:var(--shadow);
}
.letter-detail .the-letter{font-size:5.5rem;font-weight:800;line-height:1;margin:4px 0}
.letter-detail .letter-name{font-size:1.5rem;color:var(--c1);font-weight:800}
.forms-row{display:flex;justify-content:center;gap:12px;margin:16px 0}
.form-box{background:var(--soft);border-radius:16px;padding:10px 18px;min-width:86px}
.form-box .f-val{font-size:2rem;font-weight:800}
.form-box .f-lab{font-size:.85rem;color:#7a72a8}
.word-box{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:#fff8e1;border:2px dashed #ffd54f;border-radius:18px;padding:12px;margin:10px auto;max-width:340px;
}
.word-box .w-emoji{font-size:4.2rem;line-height:1}
.word-box .w-word{font-size:2rem;font-weight:800}
.detail-nav{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.haraka-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.haraka-card{background:var(--card);border-radius:22px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.haraka-card .h-ex{font-size:3.2rem;font-weight:800;color:var(--c2)}
.haraka-card .h-name{font-size:1.25rem;font-weight:800;margin:6px 0}
.haraka-card .h-sym{font-size:1.6rem;color:var(--c1)}
.quiz-box{background:var(--card);border-radius:26px;padding:22px;text-align:center;box-shadow:var(--shadow)}
.q-progress{font-weight:800;color:#7a72a8;margin-bottom:10px}
.q-big{font-size:3rem;line-height:1.6;margin:10px 0;word-spacing:14px}
.q-big.letters{font-size:4.5rem}
.q-prompt{font-size:1.3rem;font-weight:800;margin:8px 0 16px}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:560px;margin:0 auto}
.opt{
  font-family:inherit;border:3px solid #e0d7ff;background:#fff;border-radius:18px;
  font-size:1.7rem;font-weight:800;padding:14px 8px;cursor:pointer;color:var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.06); transition:transform .1s ease;
}
.opt:active{transform:scale(.95)}
.opt.correct{background:#c8f7d8;border-color:#00c853}
.opt.wrong{background:#ffd6de;border-color:#ff4081;animation:shake .4s}
.opt:disabled{cursor:default;opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q-explain{min-height:1.6em;font-size:1.05rem;color:#5c548c;margin-top:12px;font-weight:700}
.result-box{text-align:center;background:var(--card);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
.result-box .r-stars{font-size:3rem;letter-spacing:6px;margin:8px 0}
.result-box .r-msg{font-size:1.4rem;font-weight:800;margin:6px 0}
.result-box .r-score{font-size:1.1rem;color:#5c548c}
.wb-slots{display:flex;justify-content:center;gap:6px;margin:14px 0;direction:rtl}
.wb-slot{
  min-width:64px;height:76px;background:var(--soft);border:3px dashed #c9bcff;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;
}
.wb-word-preview{font-size:2.6rem;font-weight:800;min-height:1.4em;margin:4px 0}
.wb-tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.wb-tile{
  font-family:inherit;font-size:2rem;font-weight:800;color:var(--ink);
  background:#fff;border:3px solid #ffd54f;border-radius:16px;width:70px;height:70px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.06);
}
.wb-tile:disabled{opacity:.25;cursor:default}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.mem-card{
  aspect-ratio:1; border:none; border-radius:16px; font-size:2rem; cursor:pointer;
  background:var(--c1); color:#fff; font-family:inherit; box-shadow:var(--shadow);
  transition:transform .2s ease;
}
.mem-card.flipped{background:#fff;border:3px solid #e0d7ff;transform:rotateY(180deg)}
.mem-card.matched{background:#c8f7d8;border:3px solid #00c853;transform:none;cursor:default}
.guide{background:var(--card);border-radius:26px;padding:26px;box-shadow:var(--shadow);line-height:2;font-size:1.05rem}
.guide h3{color:var(--c1);margin:18px 0 6px}
.certificate{
  background:linear-gradient(160deg,#fffdf5,#fff8e1); border:6px double #ffb300; border-radius:20px;
  padding:36px 26px; text-align:center; max-width:640px; margin:0 auto;
}
.certificate .c-title{font-size:2rem;font-weight:800;color:#e65100;margin:4px 0}
.certificate .c-name{font-size:2.2rem;font-weight:800;color:var(--c1);margin:12px 0;border-bottom:3px dotted #c9bcff;display:inline-block;padding:0 24px 4px}
.certificate .c-text{font-size:1.15rem;line-height:2}
.certificate .c-stars{font-size:2rem;letter-spacing:6px;margin:10px 0}
.name-input{
  font-family:inherit;font-size:1.2rem;font-weight:700;text-align:center;
  border:3px solid #e0d7ff;border-radius:14px;padding:10px 16px;width:min(320px,90%);margin:10px auto;display:block;
}
.locked-note{text-align:center;background:#fff3c4;border:2px solid #ffd54f;border-radius:18px;padding:18px;font-weight:700}
.confetti-piece{position:fixed;top:-40px;font-size:1.6rem;z-index:999;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.6}}
.center{text-align:center}
.mt{margin-top:16px}
footer{ text-align:center;padding:20px;color:#9a92c4;font-size:.9rem }
.brand-sub{font-size:.75rem;color:#9a92c4;font-weight:700}
.trace-wrap{position:relative;width:min(340px,88vw);aspect-ratio:1;margin:14px auto;background:#fff;border:3px solid #e0d7ff;border-radius:22px;touch-action:none}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:19px;touch-action:none}
.report-box{background:linear-gradient(160deg,#fffdf5,#fff);border:3px solid #e0d7ff;border-radius:22px;padding:26px;max-width:680px;margin:0 auto}
.report-box h3{text-align:center;color:var(--c1);margin:6px 0 2px;font-size:1.5rem}
.report-table{width:100%;border-collapse:collapse;margin-top:14px}
.report-table th,.report-table td{border:2px solid #eee7ff;padding:8px 10px;text-align:center;font-size:1.05rem}
.report-table th{background:var(--soft)}
.report-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:8px;font-weight:700;color:#5c548c}
.c-brand{margin-top:12px;font-weight:800;color:var(--c1)}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;inset:0;margin:40px auto}
  header,footer{display:none}
}
@media (max-width:520px){
  .q-big{font-size:2.2rem} .q-big.letters{font-size:3.4rem}
  .letter-detail .the-letter{font-size:4.2rem}
  .wb-slot{min-width:52px;height:64px;font-size:2rem}
  .wb-tile{width:58px;height:58px;font-size:1.7rem}
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#app.fade-in{animation:fadeInUp .32s ease}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.units .unit-card{animation:popIn .4s ease backwards}
.opt:hover{border-color:var(--c1)}
.unit-card:hover{box-shadow:0 8px 0 rgba(0,0,0,.08),0 14px 28px rgba(0,0,0,.14)}
.praise-toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#ffd54f,#ff9800);color:#3d2c00;font-weight:800;
  padding:12px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  font-size:1.15rem;z-index:1000;white-space:nowrap;
  animation:toastPop .3s ease, toastFade 2.2s ease forwards;
}
@keyframes toastPop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes toastFade{0%,72%{opacity:1}100%{opacity:0}}
</style>
</head>

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function toArNum(n){const d="٠١٢٣٤٥٦٧٨٩";return String(n).split("").map(c=>d[+c]).join("");}
function letterForms(l){
  const nc=NON_CONNECTING.includes(l);
  return {first: nc? l : l+"ـ", middle: nc? "ـ"+l : "ـ"+l+"ـ", last:"ـ"+l};
}
function pickOthers(pool,correct,count,keyFn){
  const others=shuffle(pool.filter(x=>keyFn(x)!==keyFn(correct))).slice(0,count);
  return shuffle(others.concat([correct]));
}

let audioCtx=null;
function tone(freq,dur,delay){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime+(delay||0);
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function soundCorrect(){tone(523,.18);tone(659,.22,.15);}
function soundWrong(){tone(196,.3);}
function soundWin(){tone(523,.15);tone(659,.15,.13);tone(784,.15,.26);tone(1047,.35,.39);}

const MALE_VOICE_HINTS=["majed","maged","tarik","hamed","mehdi","mansour","yousef","khalid","hamid"];
function loadVoices(){
  const vs=window.speechSynthesis? speechSynthesis.getVoices():[];
  const arVoices=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  let picked=P.voiceName? arVoices.find(v=>v.name===P.voiceName):null;
  if(!picked){
    const nonMale=arVoices.filter(v=>!MALE_VOICE_HINTS.some(h=>v.name.toLowerCase().includes(h)));
    picked=nonMale[0]||arVoices[0]||null;
  }
  arVoice=picked;
  enVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"))||null;
  populateVoiceSelect();
}

function populateVoiceSelect(){

/* تحويل المقاطع القصيرة لصيغة ينطقها القارئ الآلي نطقاً صحيحاً */
function phon(t){
  if(t.length>4)return t;
  if(t.endsWith("ً"))return t.slice(0,-1)+"َنْ";   // تنوين فتح: بً → بَنْ
  if(t.endsWith("ٌ"))return t.slice(0,-1)+"ُنْ";   // تنوين ضم: بٌ → بُنْ
  if(t.endsWith("ٍ"))return t.slice(0,-1)+"ِنْ";   // تنوين كسر: بٍ → بِنْ
  if(t.endsWith("ْ"))return "أَ"+t;                 // سكون: بْ → أَبْ
  if(t.endsWith("َا"))return t+"ا";                 // مد الألف: بَا → صوت ممدود
  if(t.endsWith("ُو"))return t+"و";                 // مد الواو
  if(t.endsWith("ِي"))return t+"ي";                 // مد الياء
  return t;
}
function speak(text){
  if(!window.speechSynthesis) return;
  try{
    const short=text.length<=4;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(phon(text));
    u.lang="ar-SA"; if(arVoice)u.voice=arVoice; u.rate=short?0.65:0.8; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speakEN(text){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if(enVoice)u.voice=enVoice; u.rate=0.75; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* تشغيل ملف صوتي بشري إن وُجد بجانب الكتاب، وإلا القارئ الآلي */
function playOrSpeak(key,text){
  let done=false;
  const fb=()=>{if(!done){done=true;speak(text);}};
  try{
    const a=new Audio("audio/"+key+".mp3");
    a.onerror=fb;
    a.play().then(()=>{done=true;}).catch(fb);
  }catch(e){fb();}
}

  try{

    t.className="praise-toast"; t.textContent=text;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2200);
  }catch(e){}
}

function bumpStreak(){
  const t=todayStr();
  if(P.lastPlay===t)return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  P.streak=(P.lastPlay===y)? (P.streak||0)+1 : 1;
  P.lastPlay=t;
  P.best=Math.max(P.best||0,P.streak);
  saveP();
  if(P.streak>1)showToast("🔥 سلسلة "+toArNum(P.streak)+" يوم متواصل!");
}

let MATCH=null;
function startMatch(){
  const pool=shuffle(MATCH_POOLS[Math.floor(Math.random()*MATCH_POOLS.length)]);
  const items=pool.slice(0,Math.min(6,pool.length));
  MATCH={items:items,leftOrder:shuffle(items.map((x,i)=>i)),rightOrder:shuffle(items.map((x,i)=>i)),
         leftSel:null,matchedL:new Set(),matchedR:new Set(),mistakes:0};
  renderMatch();
}
function renderMatch(){
  let leftHtml="",rightHtml="";
  MATCH.leftOrder.forEach(i=>{
    const done=MATCH.matchedL.has(i), sel=MATCH.leftSel===i;
    leftHtml+='<button class="wb-tile" style="width:auto;min-width:130px;height:auto;padding:14px 10px;font-size:1.15rem;'+
      (done?'opacity:.25;':'')+(sel?'border-color:var(--c1);border-width:4px;':'')+'" '+(done?'disabled':'')+
      ' onclick="matchPickLeft('+i+')">'+MATCH.items[i].name+'</button>';
  });
  MATCH.rightOrder.forEach(i=>{
    const done=MATCH.matchedR.has(i);
    rightHtml+='<button class="wb-tile" '+(done?'disabled style="opacity:.25"':'')+' onclick="matchPickRight('+i+')">'+MATCH.items[i].emoji+'</button>';
  });
  app.innerHTML='<div class="screen-title">'+backBtn()+'<h2>🔗 وصّل</h2></div>'+
  '<p class="center" style="color:#5c548c">اضغط على الاسم، ثم اضغط على الصورة اللي تناسبه</p>'+
  '<div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap">'+
  '<div style="display:flex;flex-direction:column;gap:10px">'+leftHtml+'</div>'+
  '<div style="display:flex;flex-direction:column;gap:10px">'+rightHtml+'</div>'+
  '</div>'+
  '<div class="q-explain center mt" id="q-explain"></div>';
}
function matchPickLeft(i){
  if(MATCH.matchedL.has(i))return;
  MATCH.leftSel=i; renderMatch();
}
function matchPickRight(i){
  if(MATCH.matchedR.has(i)||MATCH.leftSel===null)return;
  const wasLeft=MATCH.leftSel;
  if(wasLeft===i){
    MATCH.matchedL.add(i); MATCH.matchedR.add(i); MATCH.leftSel=null;
    soundCorrect();
    if(MATCH.matchedL.size===MATCH.items.length){setTimeout(matchFinish,500);return;}
    renderMatch();
    const ex=document.getElementById("q-explain"); if(ex)ex.textContent="✅ صح!";
  }else{
    MATCH.mistakes++; soundWrong(); MATCH.leftSel=null;
    renderMatch();
    const ex=document.getElementById("q-explain"); if(ex)ex.textContent="حاول مرة ثانية 💪";
  }
}
function matchFinish(){
  const st=MATCH.mistakes<=1?3:MATCH.mistakes<=3?2:1;
  setStars("gMatch",st);
  soundWin();confetti();praise();
  app.innerHTML='<div class="result-box">'+
  '<div style="font-size:3rem">🎉</div>'+

let Q=null;
function startEngine(key,title,qs,restart){
  Q={key:key,title:title,qs:qs,idx:0,score:0,restart:restart||key};
  renderQuestion();
}
function renderQuestion(){
  const q=Q.qs[Q.idx];
  let opts="";
  q.options.forEach((o,i)=>{
    opts+='<button class="opt" id="opt-'+i+'" onclick="answer('+i+')">'+o.label+'</button>';
  });
  const speakFn=q.speakFn||"speak";
  const speakLabel=speakFn==="speakEN"?"Listen":"استمع";
  const speakCall=q.playKey? "playOrSpeak('"+q.playKey+"','"+q.speak+"')" : speakFn+"('"+q.speak+"')";
  const speakBtn=q.speak? '<button class="btn orange" onclick="'+speakCall+'">🔊 '+speakLabel+'</button>':"";
  const bigCls=q.bigIsLetter? "q-big letters":"q-big";
  app.innerHTML='<div class="screen-title">'+backBtn()+'<h2>'+Q.title+'</h2></div>'+
  '<div class="quiz-box">'+
  '<div class="q-progress">سؤال '+toArNum(Q.idx+1)+' من '+toArNum(Q.qs.length)+' ⭐ '+toArNum(Q.score)+'</div>'+
  (q.big? '<div class="'+bigCls+'">'+q.big+'</div>':"")+
  '<div class="q-prompt">'+q.prompt+'</div>'+speakBtn+
  '<div class="q-opts mt">'+opts+'</div>'+
  '<div class="q-explain" id="q-explain"></div>'+
  '</div>';
  if(q.speak)setTimeout(()=>{ if(q.playKey) playOrSpeak(q.playKey,q.speak); else (speakFn==="speakEN"?speakEN:speak)(q.speak); },400);
}
function answer(i){
  const q=Q.qs[Q.idx];
  const btns=q.options.map((_,j)=>document.getElementById("opt-"+j));
  btns.forEach(b=>b.disabled=true);
  const correctIdx=q.options.findIndex(o=>o.correct);
  if(q.options[i].correct){
    btns[i].classList.add("correct");
    Q.score++; soundCorrect();
    document.getElementById("q-explain").textContent="✅ إجابة صحيحة!"+(q.explain? " — "+q.explain:"");
  }else{
    btns[i].classList.add("wrong");
    btns[correctIdx].classList.add("correct");
    soundWrong();
    document.getElementById("q-explain").textContent="الإجابة الصحيحة: "+q.options[correctIdx].label+(q.explain? " — "+q.explain:"");
  }
  setTimeout(()=>{
    Q.idx++;
    if(Q.idx<Q.qs.length)renderQuestion();
    else finishEngine();
  },1400);
}
function starsFor(score,total){
  const r=score/total;
  if(r>=0.9)return 3; if(r>=0.7)return 2; if(r>=0.5)return 1; return 0;
}
function finishEngine(){
  const st=starsFor(Q.score,Q.qs.length);
  setStars(Q.key,st);
  if(Q.key==="final"&&Q.score>=8){P.cert=true;saveP();}
  const msg=st===3?"ممتاز! مجهودك الكبير حقق النتيجة!":st===2?"أحسنت! تدريبك بدأ يأتي بثماره":st===1?"جيد! كل محاولة تقرّبك للنجاح":"لا بأس، التدريب يصنع الأبطال!";
  if(st>=2){soundWin();confetti();praise();}else soundCorrect();
  const certBtn=(Q.key==="final"&&P.cert)? '<button class="btn pink" onclick="go(\'cert\')">🎖️ اذهب إلى شهادتك</button>':"";
  app.innerHTML='<div class="result-box">'+
  '<div style="font-size:3rem">'+(st>=2?"🎉":"💪")+'</div>'+
  '<div class="r-stars">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div>'+
  '<div class="r-msg">'+msg+'</div>'+
  '<div class="r-score">نتيجتك: '+toArNum(Q.score)+' من '+toArnumSafe(Q.qs.length)+'</div>'+
  '<div class="detail-nav mt"><button class="btn green" onclick="go(\''+Q.restart+'\')">🔄 إعادة اللعب</button>'+certBtn+
  '<button class="btn ghost" onclick="go(\'home\')">🏠 الرئيسية</button></div>'+
  '</div>';
}

let WB=null;
function startBuild(){
  const order=[];
  BUILD_LEVELS.forEach(lv=>{
    shuffle(lv.words).forEach(w=>order.push({w:w.w,emoji:w.emoji,label:lv.label}));
  });
  WB={order:order,idx:0,current:[],mistakes:0,locked:false};
  renderBuild();
}
function renderBuild(){
  const item=WB.order[WB.idx];
  const chars=[...item.w];
  const tilesArr=WB.tiles||(WB.tiles=shuffle(chars.map((c,i)=>({c:c,id:i,used:false}))));
  let slots="";
  for(let i=0;i<chars.length;i++){
    slots+='<div class="wb-slot">'+(WB.current[i]!==undefined? WB.current[i].c:"")+'</div>';
  }
  let tiles="";
  tilesArr.forEach((t,i)=>{
    tiles+='<button class="wb-tile" '+(t.used?"disabled":"")+' onclick="wbPick('+i+')">'+t.c+'</button>';
  });
  app.innerHTML='<div class="screen-title">'+backBtn()+'<h2>🧩 ركّب الكلمة</h2></div>'+
  '<div class="quiz-box">'+
  '<div class="q-progress" style="color:var(--c1)">'+item.label+'</div>'+
  '<div class="q-progress">كلمة '+toArNum(WB.idx+1)+' من '+toArNum(WB.order.length)+'</div>'+
  '<div style="font-size:4rem">'+item.emoji+'</div>'+
  '<button class="btn small orange" onclick="speak(\''+item.w+'\')">🔊 استمع للكلمة</button>'+
  '<div class="wb-word-preview">'+WB.current.map(t=>t.c).join("")+'</div>'+
  '<div class="wb-slots">'+slots+'</div>'+
  '<div class="wb-tiles">'+tiles+'</div>'+
  '<button class="btn small ghost" onclick="wbClear()">🧹 مسح</button>'+
  '<div class="q-explain" id="q-explain"></div>'+
  '</div>';
}
function wbPick(i){
  if(WB.locked)return;
  const item=WB.order[WB.idx], chars=[...item.w];
  const t=WB.tiles[i];
  if(t.used)return;
  t.used=true; WB.current.push(t);
  if(WB.current.length===chars.length){
    const built=WB.current.map(x=>x.c).join("");
    WB.locked=true;
    renderBuild();
    const exp=document.getElementById("q-explain");
    if(built===item.w){
      soundCorrect(); exp.textContent="✅ أحسنت! الكلمة صحيحة: "+item.w;
      setTimeout(()=>{
        WB.idx++; WB.current=[]; WB.tiles=null; WB.locked=false;
        if(WB.idx<WB.order.length)renderBuild(); else wbFinish();
      },1200);
    }else{
      soundWrong(); WB.mistakes++; exp.textContent="حاول مرة أخرى 💪";
      setTimeout(()=>{
        WB.current=[]; WB.tiles.forEach(x=>x.used=false); WB.locked=false; renderBuild();
      },1100);
    }
  }else{
    renderBuild();
  }
}
function wbClear(){
  if(WB.locked)return;
  WB.current=[]; WB.tiles.forEach(t=>t.used=false); renderBuild();
}
function wbFinish(){
  const st=WB.mistakes<=3?3:WB.mistakes<=8?2:1;
  setStars("gBuild",st);
  soundWin();confetti();praise();
  app.innerHTML='<div class="result-box">'+
  '<div style="font-size:3rem">🎉</div>'+

/* ====================== إكس أو ====================== */
const XO_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let XO=null;
function startXO(){
  XO={board:Array(9).fill(null),wins:0,round:1,totalRounds:3,gameOver:false};
  renderXO();
}
function xoWinner(b){
  for(const l of XO_LINES){ if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]) return b[l[0]]; }
  return b.every(x=>x)? "draw":null;
}
function xoBestMove(b){
  for(let i=0;i<9;i++){ if(!b[i]){ b[i]="O"; if(xoWinner(b)==="O"){b[i]=null;return i;} b[i]=null; } }
  for(let i=0;i<9;i++){ if(!b[i]){ b[i]="X"; if(xoWinner(b)==="X"){b[i]=null;return i;} b[i]=null; } }
  if(!b[4])return 4;
  const corners=[0,2,6,8].filter(i=>!b[i]);
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  const rest=b.map((v,i)=>v?null:i).filter(i=>i!==null);
  return rest.length? rest[Math.floor(Math.random()*rest.length)]:-1;
}
function renderXO(){
  let cells="";
  XO.board.forEach((v,i)=>{
    cells+='<button class="wb-tile" style="width:70px;height:70px;font-size:2.4rem" onclick="xoMove('+i+')" '+((v||XO.gameOver)?"disabled":"")+'>'+(v==="X"?"❌":v==="O"?"⭕":"")+'</button>';
  });
  app.innerHTML='<div class="screen-title">'+backBtn()+'<h2>❌⭕ إكس أو</h2></div>'+
  '<p class="center" style="color:#5c548c">جولة '+toArNum(XO.round)+' من '+toArNum(XO.totalRounds)+' — أنت ❌ والكمبيوتر ⭕ — فوزك: '+toArNum(XO.wins)+'</p>'+
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:14px auto">'+cells+'</div>'+
  '<div class="q-explain center" id="q-explain"></div>';
}
function xoMove(i){
  if(XO.gameOver||XO.board[i])return;
  XO.board[i]="X";
  let w=xoWinner(XO.board);
  if(!w){
    const ai=xoBestMove(XO.board);
    if(ai!==-1)XO.board[ai]="O";
    w=xoWinner(XO.board);
  }
  renderXO();
  if(w){
    XO.gameOver=true;
    const ex=document.getElementById("q-explain");
    if(w==="X"){XO.wins++;soundWin();if(ex)ex.textContent="🎉 فزت!";}
    else if(w==="O"){soundWrong();if(ex)ex.textContent="😅 خسرت هالمرة، حاول تاني";}
    else{soundCorrect();if(ex)ex.textContent="🤝 تعادل!";}
    setTimeout(()=>{
      if(XO.round>=XO.totalRounds)xoFinish();
      else{XO.round++;XO.board=Array(9).fill(null);XO.gameOver=false;renderXO();}
    },1400);
  }
}
function xoFinish(){
  const st=XO.wins>=2?3:XO.wins>=1?2:1;
  setStars("gXO",st);
  soundWin();confetti();praise();
  app.innerHTML='<div class="result-box">'+
  '<div style="font-size:3rem">🏆</div>'+
  '<div class="r-stars">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div>'+
  '<div class="r-msg">فزت '+toArNum(XO.wins)+' من '+toArNum(XO.totalRounds)+' جولات</div>'+
  '<div class="detail-nav mt"><button class="btn green" onclick="go(\'gXO\')">🔄 إعادة اللعب</button>'+
  '<button class="btn ghost" onclick="go(\'home\')">🏠 الرئيسية</button></div></div>';

function penKick(dir){
  if(PEN.locked)return;
  PEN.locked=true;
  const dirs=["left","mid","right"];
  const keeper=dirs[Math.floor(Math.random()*3)];
  const scored=keeper!==dir;
  const ball=document.getElementById("pen-ball");
  const keeperEl=document.getElementById("pen-keeper");
  if(ball){ ball.style.left=PEN_ZONES[dir]+"%"; ball.style.bottom="120px"; }
  if(keeperEl){ keeperEl.style.left=PEN_ZONES[keeper]+"%"; }
  setTimeout(()=>{
    if(scored){PEN.goals++;soundCorrect();}else{soundWrong();}
    const ex=document.getElementById("q-explain");
    if(ex)ex.textContent=scored?"⚽ هـــدف!":"🧤 تصدى لها الحارس!";
    if(ball) ball.textContent=scored?"🥳":"😅";
  },560);
  setTimeout(()=>{
    PEN.kick++;
    PEN.locked=false;
    if(PEN.kick>=PEN.total)penFinish(); else renderPenalty();
  },1700);
}

  });

function memFlip(i){
  const c=MEM.cards[i];
  if(MEM.lock||c.flipped||c.matched)return;
  c.flipped=true; MEM.open.push(i); tone(440,.1);
  if(MEM.open.length===2){
    MEM.moves++; MEM.lock=true; renderMemory();
    const a=MEM.cards[MEM.open[0]], b=MEM.cards[MEM.open[1]];
    if(a.e===b.e){
      setTimeout(()=>{
        a.matched=b.matched=true; a.flipped=b.flipped=false;
        MEM.open=[]; MEM.lock=false; soundCorrect();
        if(MEM.cards.every(x=>x.matched))memFinish(); else renderMemory();

  '</div>';

function initTrace(){
  const g=document.getElementById("tr-guide"),dv=document.getElementById("tr-draw");
  if(!g||!g.getContext)return;
  let gc=null,dc=null;
  try{gc=g.getContext("2d");dc=dv.getContext("2d");}catch(e){}
  if(!gc||!dc)return;
  TR.gc=gc;TR.dc=dc;
  drawGuideNow(gc);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(document.getElementById("tr-guide")===g)drawGuideNow(gc);});
  let drawing=false;
  const pos=e=>{const r=dv.getBoundingClientRect();return[(e.clientX-r.left)*dv.width/r.width,(e.clientY-r.top)*dv.height/r.height];};
  const stroke=()=>{dc.lineWidth=18;dc.lineCap="round";dc.lineJoin="round";dc.strokeStyle="#ff6d00";dc.stroke();};
  dv.addEventListener("pointerdown",e=>{
    e.preventDefault();drawing=true;
    try{dv.setPointerCapture(e.pointerId);}catch(err){}
    const p=pos(e);dc.beginPath();dc.moveTo(p[0],p[1]);dc.lineTo(p[0]+0.1,p[1]+0.1);stroke();
  });
  dv.addEventListener("pointermove",e=>{
    if(!drawing)return;const p=pos(e);dc.lineTo(p[0],p[1]);stroke();
  });
  const end=()=>{drawing=false;};
  dv.addEventListener("pointerup",end);
  dv.addEventListener("pointercancel",end);
}
function drawGuideNow(gc){
  gc.clearRect(0,0,340,340);
  gc.font="240px 'Baloo Bhaijaan 2','Segoe UI',Tahoma,Arial";
  gc.textAlign="center";gc.textBaseline="middle";
  gc.fillStyle="#ddd3fa";
  gc.fillText(LETTERS[TR.idx].l,170,180);
}
function traceClear(){
  if(TR.dc)TR.dc.clearRect(0,0,340,340);

}
function traceCheck(){
  let ok=true;
  try{
    const gd=TR.gc.getImageData(0,0,340,340).data;
    const dd=TR.dc.getImageData(0,0,340,340).data;
    const step=3, G=Math.ceil(340/step), R=4; // R*step=12px تسامح حول خط الطفل
    const gGrid=new Uint8Array(G*G), dGrid=new Uint8Array(G*G);
    let drawn=0;
    for(let gy=0;gy<G;gy++){
      for(let gx=0;gx<G;gx++){
        const x=gx*step, y=gy*step, i=(y*340+x)*4+3;
        if(gd[i]>60)gGrid[gy*G+gx]=1;
        if(dd[i]>60){dGrid[gy*G+gx]=1;drawn++;}
      }
    }
    let total=0,cov=0;
    for(let gy=0;gy<G;gy++){
      for(let gx=0;gx<G;gx++){
        if(!gGrid[gy*G+gx])continue;
        total++;
        let hit=false;
        for(let dy=-R;dy<=R&&!hit;dy++){
          const yy=gy+dy; if(yy<0||yy>=G)continue;
          for(let dx=-R;dx<=R;dx++){
            const xx=gx+dx; if(xx<0||xx>=G)continue;
            if(dGrid[yy*G+xx]){hit=true;break;}
          }
        }
        if(hit)cov++;
      }
    }
    if(drawn<40)ok=false;
    else if(total>0&&cov/total<0.65)ok=false;
  }catch(e){ok=true;}
  const ex=document.getElementById("q-explain");
  if(ok){
    soundCorrect();
    if(!P.traced.includes(TR.idx)){P.traced.push(TR.idx);saveP();}
    const n=P.traced.length;
    if(n>=LETTERS.length)setStars("gTrace",3);
    else if(n>=18)setStars("gTrace",2);
    else if(n>=8)setStars("gTrace",1);
    if(ex)ex.textContent="✅ أحسنت! كتابة جميلة";
    if(n===LETTERS.length){soundWin();confetti();praise();}
    setTimeout(()=>{if(TR&&TR.idx<LETTERS.length-1){TR.idx++;renderTrace();}},1200);
  }else{
    soundWrong();
    if(ex)ex.textContent="تتبع شكل الحرف الملوّن كاملاً ثم اضغط تحقق 💪";
  }
}

/* ====================== الاحتفال ====================== */
function confetti(){
  const pieces=["🎉","⭐","🎊","✨","🌟"];
  for(let i=0;i<26;i++){
    const s=document.createElement("span");
    s.className="confetti-piece";
    s.textContent=pieces[Math.floor(Math.random()*pieces.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDelay=(Math.random()*0.7)+"s";
    s.style.fontSize=(1+Math.random()*1.2)+"rem";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3600);
  }
}
